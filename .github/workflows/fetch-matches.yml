name: Fetch Match Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
      
      - name: Install packages
        run: |
          install.packages(c("worldfootballR", "googlesheets4", "tidyverse", "dplyr"))
        shell: Rscript {0}
      
      - name: Run data fetch
        run: Rscript fetch_data.R
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
